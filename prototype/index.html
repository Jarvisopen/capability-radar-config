;td&gt;${esc(q.status)}&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;`):&#x27;&#x27;}${state.publishing?`&lt;div class=&quot;publish-box&quot; role=&quot;region&quot; aria-label=&quot;确认模拟发布&quot;&gt;&lt;h3&gt;确认模拟发布新版本&lt;/h3&gt;&lt;p&gt;${c.dims.length} 个维度，${c.dims.reduce((a,x)=&gt;a+x.levels.length,0)} 条等级区间。新版本用于后续新开始的实训，历史评价保留原版本。&lt;/p&gt;&lt;div class=&quot;row&quot;&gt;${button(&#x27;确认模拟发布&#x27;,&#x27;confirm-publish&#x27;,&#x27;class=&quot;primary cursor-interaction&quot;&#x27;)}${button(&#x27;继续编辑&#x27;,&#x27;cancel-publish&#x27;)}&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;/section&gt;&lt;/div&gt;`;}
function logic(){return `&lt;div class=&quot;head&quot;&gt;&lt;div&gt;&lt;h1&gt;配置与计算流程&lt;/h1&gt;&lt;p class=&quot;muted&quot;&gt;已确认：步骤汇总为维度分，再按该维度的分数区间判级。&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;tag&quot;&gt;规则草案&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow&quot;&gt;${[[&#x27;1 接收步骤记录&#x27;,&#x27;学生 ID、项目 ID、实训记录 ID、稳定步骤 ID&#x27;],[&#x27;2 读取绑定版本&#x27;,&#x27;实训开始时绑定发布方案；找到该维度的关联步骤&#x27;],[&#x27;3 汇总维度分&#x27;,&#x27;得分合计 ÷ 满分合计 × 100；缺少得分则待评价&#x27;],[&#x27;4 匹配等级区间&#x27;,&#x27;以未四舍五入的原始维度分匹配；展示保留 1 位小数&#x27;],[&#x27;5 保存评价快照&#x27;,&#x27;维度分、命中等级、步骤依据、规则版本、评价时间&#x27;]].map(([a,b])=&gt;`&lt;div class=&quot;flow-item&quot;&gt;&lt;b&gt;${a}&lt;/b&gt;&lt;span class=&quot;small muted&quot;&gt;${b}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;logic-grid&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;后台管理的对象&lt;/h2&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;对象&lt;/th&gt;&lt;th&gt;核心内容&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;评价方案&lt;/td&gt;&lt;td&gt;项目 ID、方案 ID、版本、草稿 / 发布状态&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;能力维度&lt;/td&gt;&lt;td&gt;维度 ID、名称、显示顺序；每方案 3–8 个&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;等级区间&lt;/td&gt;&lt;td&gt;所属维度、等级序号、起始分数；每维度 2–5 级，固定显示 Lv1–Lv5&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;步骤关联&lt;/td&gt;&lt;td&gt;维度 ID + 步骤 ID；允许跨维度复用，同维度去重&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;评价结果&lt;/td&gt;&lt;td&gt;实训记录 ID、规则版本、维度得分、命中等级、依据快照&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;发布与异常处理&lt;/h2&gt;&lt;div class=&quot;grade-list&quot;&gt;&lt;div class=&quot;grade&quot;&gt;配置名称、数量、步骤及连续区间均校验通过，才可发布。&lt;/div&gt;&lt;div class=&quot;grade&quot;&gt;数据缺失为“待评价”；明确回传 0 分才参与零分计算。&lt;/div&gt;&lt;div class=&quot;grade&quot;&gt;满分须大于 0，得分须在 0 至满分之间；越界提示异常。&lt;/div&gt;&lt;div class=&quot;grade&quot;&gt;用时、操作次数和步骤评价用于追溯，不重复计算扣分。&lt;/div&gt;&lt;div class=&quot;grade&quot;&gt; function drawRadar(){const host=root.querySelector(&#x27;[data-radar]&#x27;);if(!host)return;const c=config(),W=host.clientWidth,H=host.clientHeight,cx=W/2,cy=H/2,R=Math.min(W*.29,112),L=R+37;const xy=(i,r)=&gt;[cx+Math.sin(i*2*Math.PI/c.dims.length)*r,cy-Math.cos(i*2*Math.PI/c.dims.length)*r];const points=r=&gt;c.dims.map((_,i)=&gt;xy(i,r).join(&#x27;,&#x27;)).join(&#x27; &#x27;);let svg=`&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; role=&quot;img&quot; aria-label=&quot;${c.dims.length} 维能力雷达图，满分 100，可通过外侧按钮选择维度&quot;&gt;&lt;title&gt;各维度分数（0–100）&lt;/title&gt;`;[20,40,60,80,100].forEach(v=&gt;{svg+=`&lt;polygon points=&quot;${points(R*v/100)}&quot; fill=&quot;none&quot; stroke=&quot;var(--p-line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;${cx+5}&quot; y=&quot;${cy-R*v/100+12}&quot; fill=&quot;var(--p-muted)&quot; font-size=&quot;11&quot;&gt;${v}&lt;/text&gt;`;});c.dims.forEach((_,i)=&gt;{const p=xy(i,R);svg+=`&lt;line x1=&quot;${cx}&quot; y1=&quot;${cy}&quot; x2=&quot;${p[0]}&quot; y2=&quot;${p[1]}&quot; stroke=&quot;var(--p-line)&quot;/&gt;`;});const values=c.dims.map(d=&gt;calc(d).value);if(values.every(v=&gt;v!=null)){svg+=`&lt;polygon points=&quot;${values.map((v,i)=&gt;xy(i,R*v/100).join(&#x27;,&#x27;)).join(&#x27; &#x27;)}&quot; fill=&quot;var(--p-text)&quot; fill-opacity=&quot;.09&quot; stroke=&quot;var(--p-text)&quot; stroke-width=&quot;1.8&quot;/&gt;`;}else{values.forEach((v,i)=&gt;{const j=(i+1)%values.length;if(v!=null&amp;&amp;values[j]!=null){const a=xy(i,R*v/100),b=xy(j,R*values[j]/100);svg+=`&lt;line x1=&quot;${a[0]}&quot; y1=&quot;${a[1]}&quot; x2=&quot;${b[0]}&quot; y2=&quot;${b[1]}&quot; stroke=&quot;var(--p-text)&quot; stroke-width=&quot;1.8&quot;/&gt;`;}});}
values.forEach((v,i)=&gt;{if(v!=null){const p=xy(i,R*v/100);svg+=`&lt;circle cx=&quot;${p[0]}&quot; cy=&quot;${p[1]}&quot; r=&quot;${c.dims[i].id===state.selected?5:3}&quot; fill=&quot;var(--p-text)&quot;/&gt;`;}});svg+=&#x27;&lt;/svg&gt;&#x27;;host.innerHTML=svg+c.dims.map((d,i)=&gt;{const p=xy(i,L);return button(`${esc(d.name)}&lt;span&gt;${fmt(values[i])}${values[i]==null?&#x27; 待评价&#x27;:&#x27;&#x27;}&lt;/span&gt;`,&#x27;student-dim&#x27;,`data-id=&quot;${d.id}&quot; class=&quot;axis-btn cursor-interaction&quot; style=&quot;left:${p[0]}px;top:${p[1]}px&quot; aria-pressed=&quot;${d.id===state.selected}&quot;`);}).join(&#x27;&#x27;);}
function render(){root.innerHTML=header()+(state.page===&#x27;admin&#x27;?admin():state.page===&#x27;logic&#x27;?logic():student())+`&lt;div class=&quot;status-line&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;${esc(state.notice)}${state.undo?&#x27; &#x27;+button(&#x27;撤销删除&#x27;,&#x27;undo&#x27;):&#x27;&#x27;}&lt;/div&gt;&lt;/main&gt;`;requestAnimationFrame(drawRadar);}

root.addEventListener(&#x27;click&#x27;,e=&gt;{const el=e.target.closest(&#x27;button[data-act]&#x27;);if(!el||el.disabled)return;const a=el.dataset.act;if(a.startsWith(&#x27;import-&#x27;)||[&#x27;open-import&#x27;,&#x27;template&#x27;,&#x27;sample-import&#x27;,&#x27;cancel-import&#x27;,&#x27;apply-import&#x27;].includes(a))return;const d=dimension();if(a===&#x27;page&#x27;){state.page=el.dataset.id;state.preview=false;state.notice=&#x27;&#x27;;}else if(a===&#x27;student-dim&#x27;){state.selected=el.dataset.id;}else if(a===&#x27;admin-dim&#x27;){state.selected=el.dataset.id;}else if(a===&#x27;add&#x27;&amp;&amp;state.draft.dims.length&lt;8){state.undo=null;const id=&#x27;D&#x27;+Date.now().toString(36);state.draft.dims.push({id,name:`新维度 ${state.draft.dims.length+1}`,stepIds:[],levels:newLevels(3)});state.selected=id;changed();}else if(a===&#x27;delete&#x27;&amp;&amp;state.draft.dims.length&gt;3){const index=state.draft.dims.indexOf(d);state.undo={dimension:copy(d),index};state.draft.dims.splice(index,1);state.selected=state.draft.dims[Math.max(0,index-1)].id;changed();state.notice=&#x27;维度已从草稿移除，可撤销。&#x27;;}else if(a===&#x27;undo&#x27;&amp;&amp;state.undo&amp;&amp;state.draft.dims.length&lt;8){state.draft.dims.splice(state.undo.index,0,state.undo.dimension);state.selected=state.undo.dimension.id;state.undo=null;changed();}else if(a===&#x27;move&#x27;){const i=state.draft.dims.indexOf(d),j=i+Number(el.dataset.direction);if(j&gt;=0&amp;&amp;j&lt;state.draft.dims.length){[state.draft.dims[i],state.draft.dims[j]]=[state.draft.dims[j],state.draft.dims[i]];changed();}}else if(a===&#x27;save&#x27;){state.saved=copy(state.draft);state.dirty=false;state.notice=&#x27;草稿已保存到本次原型会话；未提交真实服务。&#x27;;}else if(a===&#x27;check&#x27;){state.checked=true;state.notice=validate(state.draft).length?&#x27;请修正标注的问题。&#x27;:&#x27;全部配置校验通过，可预览或发布。&#x27;;}else if(a===&#x27;preview&#x27;){state.checked=true;if(!validate(state.draft).length){state.preview=true;state.page=&#x27;student&#x27;;state.scenario=&#x27;complete&#x27;;}else state.notice=&#x27;请先修正配置问题后预览。&#x27;;}else if(a===&#x27;publish&#x27;){state.checked=true;state.publishing=validate(state.draft).length===0;}else if(a===&#x27;cancel-publish&#x27;){state.publishing=false;}else if(a===&#x27;confirm-publish&#x27;&amp;&amp;!validate(state.draft).length){const next=&#x27;V1.&#x27;+(Number(state.published.version.split(&#x27;.&#x27;)[1])+1);state.published=copy(state.draft);state.published.version=next;state.draft=copy(state.published);state.saved=copy(state.draft);state.dirty=false;state.publishing=false;state.notice=`已模拟发布 ${next}。学生端可查看当前发布方案的样例试算；历史实训不重算。`;}

const importHeaders={ability:[&#x27;能力维度名称&#x27;,&#x27;关联步骤序号&#x27;,&#x27;起始分数&#x27;],steps:[&#x27;步骤序号&#x27;,&#x27;满分&#x27;]};
function importState(){return state.importer||(state.importer={filename:&#x27;&#x27;,ability:[],steps:[],tab:&#x27;ability&#x27;,page:0,ack:false,parsing:false,parseErrors:[]});}
function normalizeSeq(v){const s=String(v??&#x27;&#x27;).trim();return /^\d+$/.test(s)&amp;&amp;Number(s)&gt;0&amp;&amp;Number.isSafeInteger(Number(s))?String(Number(s)).padStart(2,&#x27;0&#x27;):null;}
function seqList(v){return String(v??&#x27;&#x27;).split(/[,，、;；\s]+/).filter(Boolean).map(normalizeSeq);}
function numeric(v){return String(v??&#x27;&#x27;).trim()===&#x27;&#x27;?NaN:Number(v);}
function inspectImport(){
 const im=importState(),errors=im.parseErrors.map(message=&gt;({message})),groups=new Map(),catalog=new Map(),seen=new Set();
 const err=(table,index,col,message)=&gt;errors.push({table,index,col,message:`${table===&#x27;ability&#x27;?&#x27;能力维度表&#x27;:&#x27;步骤表&#x27;}第 ${im[table][index]?.row||index+2} 行：${message}`});
 im.steps.forEach((row,i)=&gt;{const seq=normalizeSeq(row.v[0]),max=numeric(row.v[1]);
  if(!seq)err(&#x27;steps&#x27;,i,0,&#x27;步骤序号须为正整数&#x27;);
  else if(seen.has(seq))err(&#x27;steps&#x27;,i,0,`步骤 ${seq} 重复（01 与 1 视为同一步骤）`);
  if(seq)seen.add(seq);
  const origin=steps.find(s=&gt;s.id.slice(1)===seq);
  if(seq&amp;&amp;!origin)err(&#x27;steps&#x27;,i,0,`步骤 ${seq} 无法匹配当前实验目录`);
  if(!Number.isFinite(max)||max&lt;=0)err(&#x27;steps&#x27;,i,1,&#x27;满分须为大于 0 的数值&#x27;);
  else if(origin&amp;&amp;max!==origin.max)err(&#x27;steps&#x27;,i,1,`满分与当前实验不一致，应为 ${origin.max}`);
  if(seq&amp;&amp;origin)catalog.set(seq,{id:origin.id,max});
 });
 im.ability.forEach((row,i)=&gt;{
  const [rawName,rawRefs,rawMin]=row.v,name=String(rawName??&#x27;&#x27;).trim(),refs=seqList(rawRefs),min=numeric(rawMin);
  if(!name||name.length&gt;20)err(&#x27;ability&#x27;,i,0,&#x27;维度名称须为 1–20 个字符&#x27;);
  if(!refs.length||refs.some(s=&gt;!s))err(&#x27;ability&#x27;,i,1,&#x27;填写有效步骤序号，多个序号用逗号分隔&#x27;);
  if(new Set(refs).size!==refs.length)err(&#x27;ability&#x27;,i,1,&#x27;同一维度的关联步骤不能重复&#x27;);
  for(const seq of refs.filter(Boolean))if(!catalog.has(seq))err(&#x27;ability&#x27;,i,1,`步骤 ${seq} 未在步骤表中定义或无法匹配`);
  if(!Number.isFinite(min)||min&lt;0||min&gt;=100)err(&#x27;ability&#x27;,i,2,&#x27;起始分数须在 0（含）至 100（不含）之间&#x27;);
  if(!groups.has(name))groups.set(name,{name,refs,levels:[],indices:[]});
  const group=groups.get(name);
  if([...group.refs].sort().join(&#x27;,&#x27;)!==[...refs].sort().join(&#x27;,&#x27;))err(&#x27;ability&#x27;,i,1,&#x27;同一维度各行的关联步骤须保持一致&#x27;);
  group.levels.push({name:`Lv${group.levels.length+1}`,min});group.indices.push(i);
 });
 if(!im.steps.length)errors.push({message:&#x27;步骤表没有配置数据，请填写后重新上传或使用示例演示。&#x27;});
 if(groups.size&lt;3||groups.size&gt;8)errors.push({message:`能力维度须为 3–8 个，当前识别 ${groups.size} 个。`});
 groups.forEach(g=&gt;{
  if(g.levels.length&lt;2||g.levels.length&gt;5)err(&#x27;ability&#x27;,g.indices[0],2,`${g.name||&#x27;未命名维度&#x27;}须配置 2–5 个等级`);
  g.levels.forEach((l,j)=&gt;{
   if(j===0&amp;&amp;l.min!==0)err(&#x27;ability&#x27;,g.indices[j],2,&#x27;首个等级的起始分数须为 0&#x27;);
   if(j&gt;0&amp;&amp;l.min&lt;=g.levels[j-1].min)err(&#x27;ability&#x27;,g.indices[j],2,&#x27;等级起始分数须按行严格递增&#x27;);
  });
 });
 return {errors,groups:[...groups.values()],definitions:[...catalog.values()]};
}
function sampleImport(){const im=importState();im.filename=&#x27;示例配置（演示）&#x27;;im.ability=initial.dims.flatMap(d=&gt;d.levels.map(l=&gt;({v:[d.name,d.stepIds.map(id=&gt;id.slice(1)).join(&#x27;,&#x27;),l.min]}))).map((r,i)=&gt;({...r,row:i+2}));im.steps=steps.map((s,i)=&gt;({row:i+2,v:[s.id.slice(1),s.max]}));im.parseErrors=[];im.tab=&#x27;ability&#x27;;im.page=0;im.ack=false;}
async function loadImport(file){
 state.templateNotice=false;
 const im=importState();Object.assign(im,{filename:file.name,ability:[],steps:[],parseErrors:[],page:0,ack:false,parsing:true});render();
 try{
  if(!/\.xlsx$/i.test(file.name))throw Error(&#x27;请选择 .xlsx 配置表。&#x27;);
  if(file.size&gt;2*1024*1024)throw Error(&#x27;配置表不能超过 2 MB。&#x27;);
  if(!window.XLSX)throw Error(&#x27;Excel 解析组件暂未就绪，请稍后重新选择文件；也可先使用示例演示。&#x27;);
  const wb=XLSX.read(await file.arrayBuffer(),{type:&#x27;array&#x27;,cellFormula:true});
  for(const [key,sheetName] of [[&#x27;ability&#x27;,&#x27;能力维度表&#x27;],[&#x27;steps&#x27;,&#x27;步骤表&#x27;]]){
   const sh=wb.Sheets[sheetName];if(!sh){im.parseErrors.push(`缺少工作表“${sheetName}”，请使用空白模板。`);continue;}
   const headers=importHeaders[key];
   if(headers.some((h,c)=&gt;String(sh[XLSX.utils.encode_cell({r:0,c})]?.v??&#x27;&#x27;).trim()!==h)){im.parseErrors.push(`${sheetName}表头不正确，应为：${headers.join(&#x27;、&#x27;)}。`);continue;}
   const end=sh[&#x27;!ref&#x27;]?XLSX.utils.decode_range(sh[&#x27;!ref&#x27;]).e.r:0;
   if(end&gt;500){im.parseErrors.push(`${sheetName}最多支持 500 行，请删除多余行。`);continue;}
   for(let r=1;r&lt;=end;r++){
    const cells=headers.map((_,c)=&gt;sh[XLSX.utils.encode_cell({r,c})]);
    if(cells.some(c=&gt;c?.f))im.parseErrors.push(`${sheetName}第 ${r+1} 行包含公式，请改为直接填写值后重新上传。`);
    const values=cells.map(c=&gt;c?.v??&#x27;&#x27;);
    if(values.some(v=&gt;String(v).trim()!==&#x27;&#x27;))im[key].push({row:r+1,v:values});
   }
  }
 }catch(e){im.parseErrors=[e.message||&#x27;文件解析失败，请重新选择模板文件。&#x27;];}
 im.parsing=false;render();
}

 &lt;div class=&quot;row between block&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;第 ${im.page+1} / ${pageCount} 页 · 共 ${rows.length} 行&lt;/span&gt;&lt;div class=&quot;row&quot;&gt;${button(&#x27;上一页&#x27;,&#x27;import-prev&#x27;,im.page===0?&#x27;disabled&#x27;:&#x27;&#x27;)}${button(&#x27;下一页&#x27;,&#x27;import-next&#x27;,im.page===pageCount-1?&#x27;disabled&#x27;:&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;

 &lt;/section&gt;&lt;section class=&quot;panel block&quot;&gt;&lt;h2&gt;3. 写入草稿&lt;/h2&gt;&lt;p class=&quot;small muted block&quot;&gt;本次将替换当前草稿的能力维度、等级规则和步骤配置。已发布版本及历史成绩保持原样。&lt;/p&gt;&lt;div class=&quot;row import-summary&quot;&gt;&lt;span&gt;维度：${state.draft.dims.length} → ${data.groups.length}&lt;/span&gt;&lt;span&gt;步骤：${(state.draft.stepDefinitions||steps).length} → ${im.steps.length}&lt;/span&gt;&lt;/div&gt;&lt;label class=&quot;row&quot;&gt;&lt;input type=&quot;checkbox&quot; data-import-ack ${im.ack?&#x27;checked&#x27;:&#x27;&#x27;} ${data.errors.length?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;我已复核，确认替换当前草稿的配置&lt;/label&gt;&lt;div class=&quot;footer&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;写入后可继续编辑，保存草稿并单独发布。&lt;/span&gt;&lt;div class=&quot;row&quot;&gt;${button(&#x27;取消导入&#x27;,&#x27;cancel-import&#x27;)}${button(&#x27;确认导入到草稿&#x27;,&#x27;apply-import&#x27;,&#x27;class=&quot;primary&quot; &#x27;+(data.errors.length||!im.ack?&#x27;disabled&#x27;:&#x27;&#x27;))}&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;`}`;
}
const previousRender=render;
render=function(){
 if(state.page===&#x27;import&#x27;){root.innerHTML=header()+importView()+`&lt;div class=&quot;status-line&quot; role=&quot;status&quot;&gt;${esc(state.notice)}&lt;/div&gt;&lt;/main&gt;`;}
 else previousRender();
 if(state.page===&#x27;admin&#x27;){
  const bar=document.createElement(&#x27;section&#x27;);bar.className=&#x27;panel import-entry&#x27;;bar.innerHTML=`&lt;div&gt;&lt;b&gt;Excel 批量配置&lt;/b&gt;&lt;p class=&quot;small muted&quot;&gt;能力维度表 + 步骤表；上传后先复核，再写入草稿。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;${button(&#x27;下载空白模板&#x27;,&#x27;template&#x27;)}${button(&#x27;导入配置表&#x27;,&#x27;open-import&#x27;)}&lt;/div&gt;`;
  root.querySelector(&#x27;.head&#x27;).after(bar);
 }
 if(state.templateNotice){const note=document.createElement(&#x27;div&#x27;);note.className=&#x27;notice small&#x27;;note.setAttribute(&#x27;role&#x27;,&#x27;status&#x27;);note.textContent=&#x27;此处演示模板下载入口。实际文件“能力评价配置空白模板.xlsx”已作为对话及飞书文档附件提供，下载填写后可在此上传复核。&#x27;;root.querySelector(&#x27;.head&#x27;).after(note);}
};
root.addEventListener(&#x27;click&#x27;,e=&gt;{
 const target=e.target.closest(&#x27;button[data-act]&#x27;);if(!target||target.disabled)return;const action=target.dataset.act,im=importState();state.notice=&#x27;&#x27;;
 if(action===&#x27;open-import&#x27;){state.page=&#x27;import&#x27;;state.preview=false;state.notice=&#x27;&#x27;;}
 else if(action===&#x27;template&#x27;){downloadTemplate();return;}
 else if(action===&#x27;sample-import&#x27;)sampleImport();
 else if(action===&#x27;import-tab&#x27;){im.tab=target.dataset.id;im.page=0;}
 else if(action===&#x27;import-prev&#x27;)im.page--;
 else if(action===&#x27;import-next&#x27;)im.page++;
 else if(action===&#x27;import-locate&#x27;){const error=inspectImport().errors[Number(target.dataset.index)];im.tab=error.table;im.page=Math.floor(error.index/6);render();requestAnimationFrame(()=&gt;root.querySelector(`[data-import-cell][data-table=&quot;${error.table}&quot;][data-index=&quot;${error.index}&quot;][data-col=&quot;${error.col}&quot;]`)?.focus());return;}
 else if(action===&#x27;cancel-import&#x27;){state.importer=null;state.page=&#x27;admin&#x27;;state.notice=&#x27;已取消导入，当前草稿未改变。&#x27;;}
 else if(action===&#x27;apply-import&#x27;){
  const checked=inspectImport();if(checked.errors.length||!im.ack)return;
  const next=copy(state.draft);next.stepDefinitions=checked.definitions;
  next.dims=checked.groups.map((g,i)=&gt;({id:state.draft.dims.find(d=&gt;d.name===g.name)?.id||&#x27;I&#x27;+Date.now().toString(36)+&#x27;_&#x27;+i,name:g.name,stepIds:g.refs.map(seq=&gt;checked.definitions.find(s=&gt;s.id.slice(1)===seq).id),levels:g.levels}));
  state.draft=next;state.selected=next.dims[0].id;state.page=&#x27;admin&#x27;;state.undo=null;state.importer=null;changed();state.notice=`已将 ${next.dims.length} 个维度、${next.stepDefinitions.length} 个步骤写入草稿。请保存并预览，尚未发布。`;
 }else return;
 render();persist();
});
root.addEventListener(&#x27;change&#x27;,e=&gt;{
 const el=e.target;
 if(el.hasAttribute(&#x27;data-import-file&#x27;)){if(el.files?.[0])loadImport(el.files[0]);return;}
 if(el.hasAttribute(&#x27;data-import-cell&#x27;)){state.notice=&#x27;&#x27;;const im=importState();im[el.dataset.table][Number(el.dataset.index)].v[Number(el.dataset.col)]=el.value;im.ack=false;render();return;}
 if(el.hasAttribute(&#x27;data-import-ack&#x27;)){importState().ack=el.checked;render();}
});

window.addEventListener(&#x27;message&#x27;,e=&gt;{
 if(e.source!==parent||e.data?.type!==&#x27;prototype-navigate&#x27;)return;
 if([&#x27;admin&#x27;,&#x27;student&#x27;,&#x27;import&#x27;,&#x27;logic&#x27;].includes(e.data.view)){
  state.page=e.data.view;state.preview=false;
  if(e.data.sample&amp;&amp;state.page===&#x27;import&#x27;)sampleImport();
  if(e.data.review&amp;&amp;state.page===&#x27;admin&#x27;){state.checked=true;state.publishing=true;}
  render();
 }
});
let lastHeight=0;
new ResizeObserver(()=&gt;{const h=Math.ceil(root.getBoundingClientRect().height)+2;if(h!==lastHeight){lastHeight=h;parent.postMessage({type:&#x27;prototype-height&#x27;,height:h},&#x27;*&#x27;);}}).observe(root);

render();
})();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
<script>
const frame=document.getElementById('prototype');
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='prototype-height'&&Number.isFinite(e.data.height))frame.style.height=Math.max(480,Math.min(16000,e.data.height))+'px';});
frame.addEventListener('load',()=>{const q=new URLSearchParams(location.search);frame.contentWindow.postMessage({type:'prototype-navigate',view:q.get('view')||'admin',sample:q.get('sample')==='1',review:q.get('review')==='1'},'*');});
</script></body></html>
