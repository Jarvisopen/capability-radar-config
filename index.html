  color: var(--foreground);
  font: inherit;
  text-align: start;
  border-collapse: separate;
  border-spacing: 0;
  font-size: calc(var(--font-size-base) * 0.875);
  line-height: calc(var(--font-size-base) * 1.625);
  font-family: var(--font-sans);
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
  border-bottom-color: color-mix(in srgb, var(--foreground) 5%, transparent);
}
.table :is(th, td):not(:last-child) {
  padding-inline-end: calc(var(--font-size-base) * 1.5);
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead :is(th, td) {
  border-bottom-color: var(--border-strong, var(--input));
  padding-block: calc(var(--font-size-base) / 2);
  line-height: var(--font-size-base);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}
.table tbody :is(th, td) {
  padding-block: calc(var(--font-size-base) * 0.625);
}

.table.table-sm :is(th, td) {
  padding-block: 8px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  border: 1px solid var(--border);
  corner-shape: var(--corner-shape);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
  font-family: var(--font-sans);
  padding: 5px 12px;
  border-color: color-mix(
    in oklab,
    light-dark(var(--primary-foreground), var(--foreground)) 5%,
    transparent
  );
  border-radius: var(--radius-2xl);
  color: light-dark(var(--primary-foreground), var(--foreground));
  background: light-dark(var(--foreground), var(--popover));
  box-shadow: 0 8px 18px rgb(15 23 42 / 20%);
  letter-spacing: -0.15px;
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: 600;
  line-height: 18px;
  text-align: center;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  color: color-mix(in srgb, var(--foreground) 40%, var(--muted-foreground));
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-family: var(--font-sans);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1;
}

small,
.text-small {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

/* Match inline alignment without overriding a containing flex or grid layout. */
.btn,
.nav-link,
.form-control,
.form-select,
.form-range,
.form-check {
  vertical-align: middle;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  corner-shape: var(--corner-shape);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: inherit;
  font-family: var(--font-sans);
  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  padding-inline: var(--control-spacing, 12px);
  border-color: transparent;
  border-radius: var(--radius-full);
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.btn {
  border-color: var(--border);
  color: var(--secondary-foreground);
  background: var(--secondary);
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;

.btn.viz-tile {

a.btn {

}

.btn:not(:disabled):hover {

    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {

}

.btn-primary {
  border-color: var(--border);
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: border-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: border-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--muted-foreground);
  background: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)

}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host's design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,

}

.viz-carousel-controls &gt; button::before,

}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  font-family: var(--font-sans);
  height: calc(12px + 2 * var(--control-spacing, 12px));
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  padding-inline: calc(4px + var(--control-spacing, 12px) / 2);
  border-color: var(--input);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--popover) 96%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1.4285714286;
}
.form-control:is(
  [type=&quot;file&quot;],
  [type=&quot;date&quot;],
  [type=&quot;datetime-local&quot;],
  [type=&quot;month&quot;],
  [type=&quot;week&quot;],
  [type=&quot;color&quot;]
) {
  height: calc(12px + 2 * var(--control-spacing, 12px));
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  line-height: 18px;
}
.form-control:is(
  [type=&quot;date&quot;],
  [type=&quot;datetime-local&quot;],
  [type=&quot;month&quot;],
  [type=&quot;week&quot;]
) {
  padding-inline: var(--control-spacing, 12px);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
  padding: 0;
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
  min-height: calc(10px + 2 * var(--control-spacing, 12px));
  padding-inline: var(--control-spacing, 12px);
  margin-inline-end: var(--control-spacing, 12px);
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: calc(12px + 2 * var(--control-spacing, 12px));
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);

textarea.form-control {
  height: auto;
  resize: vertical;
  min-height: 96px;
  padding: 8px 10px;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: none;
}
.form-control:disabled {
  color: var(--muted-foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  opacity: 1;
}
.form-control[aria-invalid=&quot;true&quot;] {
  border-color: var(--red);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 20%, transparent);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  margin: 0;
  /* The secondary icon role is 14px at compact density and 16px at web density. */
  --icon-size: calc(10px + var(--control-spacing, 12px) / 2);
  /* Settings dropdowns retain a 12px inset and a 4px text-to-chevron gap. */
  padding: 0 calc(16px + var(--icon-size)) 0 12px;
  outline: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(
      45deg,
      transparent calc(50% - 0.6px),
      var(--muted-foreground) calc(50% - 0.6px) calc(50% + 0.6px),
      transparent calc(50% + 0.6px)
    ),
    linear-gradient(
      135deg,
      transparent calc(50% - 0.6px),
      var(--muted-foreground) calc(50% - 0.6px) calc(50% + 0.6px),
      transparent calc(50% + 0.6px)
    );
  background-position:
    calc(100% - 12px - var(--icon-size) / 2) 50%,
    calc(100% - 12px - var(--icon-size) * 0.18) 50%;
  background-repeat: no-repeat;
  background-size: calc(var(--icon-size) * 0.32) calc(var(--icon-size) * 0.32);
  cursor: var(--cursor-interaction, default);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.form-select option {
  color: var(--popover-foreground);
  background-color: var(--popover);
}

.form-select:not(:disabled):hover {
  background-color: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.form-select:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}
.form-select:disabled {
  opacity: 0.4;
}

.form-check {
  display: flex;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  corner-shape: round;
  box-shadow: var(--shadow-sm);
  position: relative;
  width: calc(10px + var(--control-spacing, 12px) / 2);
  height: calc(10px + var(--control-spacing, 12px) / 2);
  border-color: var(--border-strong, var(--input));
  border-radius: calc(var(--radius-sm) / 2);
  background-color: transparent;
  color: var(--foreground);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:is(:checked, :indeterminate) {
  border-color: var(--border-strong, var(--input));
  background-color: color-mix(in srgb, var(--popover) 96%, transparent);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;

  height: 6.65%;

  border-radius: var(--radius-full);
  background: var(--foreground);
  mask: none;
  content: &quot;&quot;;

  border-radius: var(--radius-full);
  width: 16px;
  height: 16px;
  border: 0;

  border-color: var(--ring);
  outline: none;
  box-shadow: 0 0 0 2px var(--ring);
}

.form-check:not(.form-switch) .form-check-input:disabled {

}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

}
.form-check:not(.form-switch) .form-check-input[type=&quot;radio&quot;]:disabled,
.form-check:not(.form-switch)
  .form-check-input[type=&quot;radio&quot;]:disabled
  + .form-check-label {

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

.form-check-label {

.form-switch .form-check-input {

  width: 32px;
  height: 20px;
  border: 0;

.form-switch .form-check-input::before {

  left: 0;

  border-color: #fff;
  background: #fff;

.form-switch .form-check-input:checked {

}

.form-switch .form-check-input:focus-visible {

}

.form-range {

  display: block;
  width: 100%;
  flex: 1;

  padding: 0;
  border: 0;

  height: calc(12px + 2 * var(--control-spacing, 12px));

  border-radius: var(--radius-full);
}

.form-range::-webkit-slider-thumb {

  width: 20px;
  height: 20px;

  border-radius: var(--radius-full);
  margin-top: -9px;
  border-color: transparent;
  background: currentColor;
  box-shadow: var(--shadow-sm);

  height: 20px;

/* Web recipes are the default, including on renderers without inline style queries. */
@supports (border-radius: if(style(--corner-shape: round): 1px; else: 2px)) {
  /* Match the host's proportional text-sm scale at every text preference. */
  .tooltip,
  .viz-badge,
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    font-size: if(
      style(--corner-shape: round): round(
          nearest,
          calc(var(--font-size-base) * 14 / 16),
          1px
        );
        else: round(nearest, calc(var(--font-size-base) * 13 / 14), 1px)
    );
  }

  .btn,
  .nav-link,
  .form-select {
    border-radius: if(

      style(--corner-shape: round): calc(var(--radius-sm) / 2);

&lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById('cap-radar-config');
const esc=x=&gt;String(x??'').replace(/[&amp;&lt;&gt;&quot;']/g,c=&gt;({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;#39;'}[c]));
const copy=x=&gt;JSON.parse(JSON.stringify(x));
const steps=[
{id:'S01',name:'安全准备',score:5,max:5,count:1,time:'00:02:00',reasonable:'00:02:00',comment:'安全防护检查完整',rule:'完成防护检查得 5 分'},
{id:'S02',name:'设备认知',score:10,max:10,count:1,time:'00:03:00',reasonable:'00:03:00',comment:'设备辨识准确',rule:'设备辨识正确得 10 分'},
{id:'S03',name:'主接线识读',score:10,max:10,count:1,time:'00:04:00',reasonable:'00:04:00',comment:'接线关系判断正确',rule:'接线判断正确得 10 分'},
{id:'S04',name:'操作票编制',score:8,max:10,count:2,time:'00:04:30',reasonable:'00:05:00',comment:'操作票检查项有遗漏',rule:'检查项遗漏扣 2 分'},
{id:'S05',name:'停电倒闸操作',score:18,max:20,count:1,time:'00:07:00',reasonable:'00:06:00',comment:'操作顺序一处不规范',rule:'一处顺序不规范扣 2 分'},
{id:'S06',name:'验电与接地',score:15,max:20,count:3,time:'00:09:00',reasonable:'00:07:00',comment:'接地核验遗漏，建议重点复盘',rule:'接地核验检查项遗漏扣 5 分'},
{id:'S07',name:'设备状态核验',score:9,max:10,count:1,time:'00:05:30',reasonable:'00:05:00',comment:'设备状态记录不完整',rule:'状态记录不完整扣 1 分'},
{id:'S08',name:'送电恢复',score:5,max:5,count:1,time:'00:03:00',reasonable:'00:03:00',comment:'恢复流程正确',rule:'恢复流程正确得 5 分'},
{id:'S09',name:'运行数据记录',score:4,max:5,count:1,time:'00:02:30',reasonable:'00:03:00',comment:'一处测量单位未注明',rule:'一处测量单位遗漏扣 1 分'},
{id:'S10',name:'结果分析',score:4,max:5,count:1,time:'00:02:06',reasonable:'00:02:00',comment:'结论缺少对应数据支撑',rule:'结论缺少数据支撑扣 1 分'}];
function newLevels(n){const cuts={2:[0,60],3:[0,60,80],4:[0,60,75,90],5:[0,40,60,75,90]}[n];return cuts.map((min,i)=&gt;({name:`Lv${i+1}`,min}));}
function fixedLevelLabels(c){c?.dims?.forEach(d=&gt;d.levels?.forEach((l,i)=&gt;l.name=`Lv${i+1}`));return c;}
const initial={version:'V1.0',dims:[
{id:'D01',name:'安全规范',stepIds:['S01','S04','S06'],levels:newLevels(3)},
{id:'D02',name:'设备理解',stepIds:['S02','S03'],levels:newLevels(3)},
{id:'D03',name:'操作执行',stepIds:['S05','S06','S08'],levels:newLevels(3)},
{id:'D04',name:'状态核验',stepIds:['S06','S07'],levels:newLevels(3)},
{id:'D05',name:'数据分析',stepIds:['S09','S10'],levels:newLevels(3)}]};
initial.stepDefinitions=steps.map(({id,max})=&gt;({id,max}));
let state={page:'admin',draft:copy(initial),published:copy(initial),saved:copy(initial),selected:'D03',preview:false,scenario:'complete',dirty:false,notice:'',checked:false,publishing:false,undo:null};
let savedRevision=0;
function restore(s){if(s&amp;&amp;s.schema===2&amp;&amp;s.revision&gt;savedRevision&amp;&amp;s.state?.draft?.dims?.length&gt;=3&amp;&amp;s.state?.draft?.dims?.length&lt;=8){savedRevision=s.revision;state={...state,...s.state};['draft','published','saved'].forEach(k=&gt;fixedLevelLabels(state[k]));if(state.undo?.dimension)state.undo.dimension.levels.forEach((l,i)=&gt;l.name=`Lv${i+1}`);return true;}return false;}
restore(window.openai?.widgetState?.privateContent);
function persist(){savedRevision=Math.max(savedRevision+1,Date.now());if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{page:state.page,dimension:dimension()?.name,dimensionCount:state.draft.dims.length,rule:'步骤得分合计 / 步骤满分合计 × 100；按分数区间判级'},privateContent:{schema:2,revision:savedRevision,state:{...copy(state),importer:null}}}).catch(()=&gt;{});}
window.addEventListener('openai:set_globals',e=&gt;{const s=e.detail?.globals?.widgetState?.privateContent;if(restore(s))render();});
const config=()=&gt;state.preview?state.draft:state.published;
const dimension=()=&gt;state.draft.dims.find(d=&gt;d.id===state.selected)||state.draft.dims[0];
function sampleSteps(){return steps.map(s=&gt;({...s,score:s.id==='S06'&amp;&amp;state.scenario==='missing'?null:s.id==='S06'&amp;&amp;state.scenario==='zero'?0:s.score}));}
function calc(d,rows=sampleSteps()){
const ids=[...new Set(d.stepIds)];const selected=ids.map(id=&gt;rows.find(s=&gt;s.id===id));
if(!ids.length)return{value:null,status:'未关联步骤',sum:0,max:0,rows:[]};
if(selected.some(s=&gt;!s||!Number.isFinite(s.max)||s.max&lt;=0))return{value:null,status:'配置异常',sum:0,max:0,rows:selected.filter(Boolean)};
const max=selected.reduce((a,s)=&gt;a+s.max,0);if(selected.some(s=&gt;s.score==null))return{value:null,status:'待评价',sum:null,max,rows:selected};
if(selected.some(s=&gt;!Number.isFinite(s.score)||s.score&lt;0||s.score&gt;s.max))return{value:null,status:'数据异常',sum:null,max,rows:selected};
const sum=selected.reduce((a,s)=&gt;a+s.score,0),value=sum/max*100;
const level=d.levels.reduce((found,l,i)=&gt;value&gt;=l.min?i:found,-1);
return{value,status:d.levels[level]?.name||'规则待完善',sum,max,rows:selected,level};
}
const fmt=n=&gt;n==null?'—':Number.isInteger(n)?String(n):n.toFixed(1);
function validate(c){const out=[];if(c.dims.length&lt;3||c.dims.length&gt;8)out.push('维度数量须为 3–8 个');const names=new Set();c.dims.forEach((d,i)=&gt;{const title=d.name.trim()||`第 ${i+1} 个维度`;if(!d.name.trim())out.push(`第 ${i+1} 个维度：填写名称`);if(names.has(d.name.trim()))out.push(`${title}：名称重复`);names.add(d.name.trim());if(!d.stepIds.length)out.push(`${title}：至少关联一个有效步骤`);if(d.stepIds.some(id=&gt;!(c.stepDefinitions||steps).some(s=&gt;s.id===id&amp;&amp;s.max&gt;0)))out.push(`${title}：存在失效步骤`);if(d.levels.length&lt;2||d.levels.length&gt;5)out.push(`${title}：等级数量须为 2–5 个`);d.levels.forEach((l,j)=&gt;{if(!Number.isFinite(l.min)||(j===0&amp;&amp;l.min!==0)||(j&gt;0&amp;&amp;l.min&lt;=d.levels[j-1].min)||l.min&lt;0||l.min&gt;=100)out.push(`${title}：分界值须从 0 起，递增且小于 100`);});});return[...new Set(out)];}
const button=(text,act,extra='')=&gt;{const cls=extra.match(/class=&quot;([^&quot;]*)&quot;/)?.[1]||'';return `&lt;button type=&quot;button&quot; class=&quot;cursor-interaction ${cls}&quot; data-act=&quot;${act}&quot; ${extra.replace(/class=&quot;[^&quot;]*&quot;/,'')}&gt;${text}&lt;/button&gt;`;};
function header(){return `&lt;div class=&quot;top&quot;&gt;&lt;div class=&quot;row&quot;&gt;&lt;strong&gt;实验教学平台&lt;/strong&gt;&lt;span class=&quot;tag&quot;&gt;低保真交互原型&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;small muted&quot;&gt;样例数据 · 未连接真实服务&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;shell&quot;&gt;&lt;nav class=&quot;tabs&quot; aria-label=&quot;原型页面&quot;&gt;${[['student','学生端展示'],['admin','后台配置'],['logic','配置与计算流程']].map(([id,name])=&gt;button(name,'page',`data-id=&quot;${id}&quot; aria-pressed=&quot;${state.page===id}&quot;`)).join('')}&lt;/nav&gt;`;}
function student(){const c=config();let d=c.dims.find(x=&gt;x.id===state.selected)||c.dims[0];const r=calc(d);return `&lt;div class=&quot;head&quot;&gt;&lt;div&gt;&lt;h1&gt;能力表现&lt;/h1&gt;&lt;p class=&quot;muted&quot;&gt;许闻 · 停送电操作实验（示例）&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;samples&quot;&gt;&lt;span class=&quot;tag&quot;&gt;${state.preview?'草稿预览':`发布方案 ${esc(c.version)}`}&lt;/span&gt;&lt;label class=&quot;small&quot;&gt;样例状态 &lt;select aria-label=&quot;样例状态&quot; data-change=&quot;scenario&quot;&gt;&lt;option value=&quot;complete&quot; ${state.scenario==='complete'?'selected':''}&gt;完整得分&lt;/option&gt;&lt;option value=&quot;missing&quot; ${state.scenario==='missing'?'selected':''}&gt;步骤 06 缺少得分&lt;/option&gt;&lt;option value=&quot;zero&quot; ${state.scenario==='zero'?'selected':''}&gt;步骤 06 实得 0 分&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;/div&gt;${state.preview?`&lt;div class=&quot;notice row between&quot;&gt;&lt;span&gt;正在查看未发布的配置。修改不会影响已发布方案。&lt;/span&gt;${button('返回后台','page','data-id=&quot;admin&quot;')}&lt;/div&gt;`:''}&lt;div class=&quot;student-grid&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;h2&gt;${c.dims.length} 维能力雷达图&lt;/h2&gt;&lt;span class=&quot;small muted&quot;&gt;统一刻度 0–100 分&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;radar&quot; data-radar&gt;&lt;/div&gt;&lt;div class=&quot;dimension-list&quot;&gt;${c.dims.map(x=&gt;{const n=calc(x);return button(`&lt;span&gt;${esc(x.name)}&lt;/span&gt;&lt;span&gt;${fmt(n.value)} 分 · ${esc(n.status)}&lt;/span&gt;`,'student-dim',`data-id=&quot;${x.id}&quot; class=&quot;dimension-item cursor-interaction&quot; aria-pressed=&quot;${x.id===d.id}&quot;`);}).join('')}&lt;/div&gt;&lt;p class=&quot;small muted block&quot;&gt;点击维度查看等级与步骤依据。缺少得分的维度不按 0 分绘制。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;panel&quot; aria-live=&quot;polite&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;h2&gt;${esc(d.name)}&lt;/h2&gt;&lt;span class=&quot;tag&quot;&gt;${d.levels.length} 级规则&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;number&quot;&gt;${fmt(r.value)}&lt;/span&gt;&lt;span class=&quot;muted&quot;&gt;/ 100&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;${esc(r.status)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;grade-list&quot;&gt;${d.levels.map((l,i)=&gt;`&lt;div class=&quot;grade ${r.value!=null&amp;&amp;r.level===i?'selected':''}&quot;&gt;&lt;span&gt;Lv${i+1}&lt;/span&gt;&lt;span class=&quot;small&quot;&gt;${l.min} ≤ 分数 ${i===d.levels.length-1?'≤ 100':`&lt; ${d.levels[i+1].min}`}${r.value!=null&amp;&amp;r.level===i?'　✓ 本次':''}&lt;/span&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;&lt;h3&gt;计算依据&lt;/h3&gt;&lt;div class=&quot;formula&quot;&gt;${r.value==null?esc(r.status)+'：相关步骤有效得分齐全后计算。':`(${r.rows.map(s=&gt;s.score).join(' + ')}) ÷ (${r.rows.map(s=&gt;s.max).join(' + ')}) × 100 = &lt;strong&gt;${fmt(r.value)} 分&lt;/strong&gt;`}&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;关联步骤&lt;/th&gt;&lt;th&gt;得分 / 满分&lt;/th&gt;&lt;th&gt;步骤评价&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${r.rows.map(s=&gt;`&lt;tr&gt;&lt;td&gt;${s.id.slice(1)} ${esc(s.name)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${s.score??'待评价'} / ${s.max}&lt;/td&gt;&lt;td&gt;${s.score==null?'尚未回传得分':state.scenario==='zero'&amp;&amp;s.id==='S06'?'模拟实得 0 分':esc(s.comment)}&lt;/td&gt;&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;small muted block&quot;&gt;等级按该维度的分数区间判定。用时、操作次数作为评价依据展示，不重复扣分。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;section class=&quot;panel raw&quot;&gt;&lt;details&gt;&lt;summary&gt;原始实验步骤记录（保留全部 9 个字段） · 完整样例总分 88 / 100&lt;/summary&gt;${rawTable()}&lt;/details&gt;&lt;/section&gt;`;}
function rawTable(){return `&lt;div class=&quot;table-wrap&quot;&gt;&lt;table style=&quot;min-width:1000px&quot;&gt;&lt;thead&gt;&lt;tr&gt;${['步骤序号','步骤名称','步骤得分','步骤满分','操作次数','步骤用时','合理用时','步骤评价','赋分模型'].map(x=&gt;`&lt;th&gt;${x}&lt;/th&gt;`).join('')}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${sampleSteps().map(s=&gt;`&lt;tr&gt;&lt;td&gt;${s.id.slice(1)}&lt;/td&gt;&lt;td&gt;${s.name}&lt;/td&gt;&lt;td&gt;${s.score??'待评价'}&lt;/td&gt;&lt;td&gt;${s.max}&lt;/td&gt;&lt;td&gt;${s.count}&lt;/td&gt;&lt;td&gt;${s.time}&lt;/td&gt;&lt;td&gt;${s.reasonable}&lt;/td&gt;&lt;td&gt;${s.comment}&lt;/td&gt;&lt;td&gt;${s.rule}&lt;/td&gt;&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;}
function admin(){const c=state.draft,d=dimension(),r=calc(d,steps),errors=state.checked?validate(c):[];return `&lt;div class=&quot;head&quot;&gt;&lt;div&gt;&lt;h1&gt;能力评价配置&lt;/h1&gt;&lt;p class=&quot;muted&quot;&gt;停送电操作实验（示例） · 草稿基于 ${esc(state.published.version)}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;tag&quot;&gt;${state.dirty?'草稿有修改':'草稿已保存'}&lt;/span&gt;${button('保存草稿','save')}${button('学生预览','preview')}${button('发布方案','publish','class=&quot;primary cursor-interaction&quot;')}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;notice small&quot;&gt;配置顺序：添加维度 → 关联步骤 → 设置等级区间 → 校验试算 → 发布。等级共用本维度的步骤，不重复绑定。&lt;/div&gt;&lt;div class=&quot;admin-grid&quot;&gt;&lt;aside class=&quot;panel side&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;h2&gt;能力维度&lt;/h2&gt;&lt;span class=&quot;small&quot;&gt;${c.dims.length} / 8&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dimension-list&quot;&gt;${c.dims.map(x=&gt;button(`&lt;span&gt;${esc(x.name)||'未命名'}&lt;/span&gt;&lt;small&gt;${x.levels.length} 级&lt;/small&gt;`,'admin-dim',`data-id=&quot;${x.id}&quot; aria-pressed=&quot;${x.id===d.id}&quot;`)).join('')}&lt;/div&gt;${button('＋ 添加维度','add',c.dims.length&gt;=8?'disabled':'')}&lt;p class=&quot;small muted block&quot;&gt;至少 3 个，最多 8 个。顺序对应雷达图的轴顺序。&lt;/p&gt;&lt;/aside&gt;&lt;section class=&quot;panel&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;h2&gt;编辑 ${esc(d.name)||'未命名维度'}&lt;/h2&gt;&lt;div class=&quot;row&quot;&gt;${button('上移','move','data-direction=&quot;-1&quot; '+(c.dims.indexOf(d)===0?'disabled':''))}${button('下移','move','data-direction=&quot;1&quot; '+(c.dims.indexOf(d)===c.dims.length-1?'disabled':''))}${button('删除','delete',c.dims.length&lt;=3?'disabled':'')}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;field-row&quot;&gt;&lt;label class=&quot;field&quot;&gt;维度名称&lt;input data-change=&quot;name&quot; aria-label=&quot;维度名称&quot; maxlength=&quot;20&quot; value=&quot;${esc(d.name)}&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;&lt;label class=&quot;field&quot;&gt;等级数量&lt;select data-change=&quot;level-count&quot; aria-label=&quot;等级数量&quot;&gt;${[2,3,4,5].map(n=&gt;`&lt;option value=&quot;${n}&quot; ${n===d.levels.length?'selected':''}&gt;${n} 级&lt;/option&gt;`).join('')}&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;editor-grid&quot;&gt;&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;h3&gt;关联步骤&lt;/h3&gt;&lt;span class=&quot;small muted&quot;&gt;${d.stepIds.length} 步 · 满分 ${r.max}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;row between small muted&quot;&gt;&lt;span&gt;选择步骤&lt;/span&gt;&lt;span&gt;步骤满分&lt;/span&gt;&lt;/div&gt;${steps.filter(s=&gt;(c.stepDefinitions||steps).some(x=&gt;x.id===s.id)).map(s=&gt;`&lt;label class=&quot;check-row&quot;&gt;&lt;input type=&quot;checkbox&quot; data-change=&quot;step&quot; value=&quot;${s.id}&quot; ${d.stepIds.includes(s.id)?'checked':''}&gt;&lt;span&gt;${s.id.slice(1)} ${s.name}&lt;/span&gt;&lt;span style=&quot;text-align:right&quot;&gt;${s.max} 分&lt;/span&gt;&lt;/label&gt;`).join('')}&lt;p class=&quot;small muted block&quot;&gt;同一步骤可关联多个维度；在同一维度只计一次。满分来自实验步骤定义。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;panel-head&quot;&gt;&lt;h3&gt;等级与分界值&lt;/h3&gt;&lt;span class=&quot;tag&quot;&gt;0–100 分&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;level-row small muted&quot;&gt;&lt;span&gt;等级（自动）&lt;/span&gt;&lt;span&gt;起始分数&lt;/span&gt;&lt;/div&gt;${d.levels.map((l,i)=&gt;`&lt;div class=&quot;level-row&quot;&gt;&lt;span class=&quot;level-label&quot;&gt;Lv${i+1}&lt;/span&gt;&lt;input type=&quot;number&quot; min=&quot;0&quot; max=&quot;99.99&quot; step=&quot;0.1&quot; aria-label=&quot;第 ${i+1} 级起始分数&quot; data-change=&quot;level-min&quot; data-index=&quot;${i}&quot; value=&quot;${Number.isFinite(l.min)?l.min:''}&quot; ${i===0?'disabled':''}&gt;&lt;/div&gt;&lt;div class=&quot;level-range&quot;&gt;${Number.isFinite(l.min)?l.min:'—'} ≤ 分数 ${i===d.levels.length-1?'≤ 100':`& function drawRadar(){const host=root.querySelector('[data-radar]');if(!host)return;const c=config(),W=host.clientWidth,H=host.clientHeight,cx=W/2,cy=H/2,R=Math.min(W*.29,112),L=R+37;const xy=(i,r)=&gt;[cx+Math.sin(i*2*Math.PI/c.dims.length)*r,cy-Math.cos(i*2*Math.PI/c.dims.length)*r];const points=r=&gt;c.dims.map((_,i)=&gt;xy(i,r).join(',')).join(' ');let svg=`&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; role=&quot;img&quot; aria-label=&quot;${c.dims.length} 维能力雷达图，满分 100，可通过外侧按钮选择维度&quot;&gt;&lt;title&gt;各维度分数（0–100）&lt;/title&gt;`;[20,40,60,80,100].forEach(v=&gt;{svg+=`&lt;polygon points=&quot;${points(R*v/100)}&quot; fill=&quot;none&quot; stroke=&quot;var(--p-line)&quot; stroke-width=&quot;1&quot;/&gt;&lt;text x=&quot;${cx+5}&quot; y=&quot;${cy-R*v/100+12}&quot; fill=&quot;var(--p-muted)&quot; font-size=&quot;11&quot;&gt;${v}&lt;/text&gt;`;});c.dims.forEach((_,i)=&gt;{const p=xy(i,R);svg+=`&lt;line x1=&quot;${cx}&quot; y1=&quot;${cy}&quot; x2=&quot;${p[0]}&quot; y2=&quot;${p[1]}&quot; stroke=&quot;var(--p-line)&quot;/&gt;`;});const values=c.dims.map(d=&gt;calc(d).value);if(values.every(v=&gt;v!=null)){svg+=`&lt;polygon points=&quot;${values.map((v,i)=&gt;xy(i,R*v/100).join(',')).join(' ')}&quot; fill=&quot;var(--p-text)&quot; fill-opacity=&quot;.09&quot; stroke=&quot;var(--p-text)&quot; stroke-width=&quot;1.8&quot;/&gt;`;}else{values.forEach((v,i)=&gt;{const j=(i+1)%values.length;if(v!=null&amp;&amp;values[j]!=null){const a=xy(i,R*v/100),b=xy(j,R*values[j]/100);svg+=`&lt;line x1=&quot;${a[0]}&quot; y1=&quot;${a[1]}&quot; x2=&quot;${b[0]}&quot; y2=&quot;${b[1]}&quot; stroke=&quot;var(--p-text)&quot; stroke-width=&quot;1.8&quot;/&gt;`;}});}

 });
